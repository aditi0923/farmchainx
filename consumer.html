<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmchainX Consumer Dashboard</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>

<body>

<header>
<nav class="navbar">

<h2 class="logo">FarmchainX</h2>

<ul class="nav-links">
<li><a href="../../index.html">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">My Orders</a></li>
</ul>

<div class="auth-buttons">
<a href="#" onclick="logout()" class="btn login">Logout</a>
</div>

</nav>
</header>

<section class="dashboard">

<h1>Consumer Dashboard</h1>
<p>Explore fresh farm products directly from farmers.</p>

<div class="dashboard-cards">

<div class="card">
<h3>Total Orders</h3>
<p>5</p>
</div>

<div class="card">
<h3>Products Purchased</h3>
<p>12</p>
</div>

<div class="card">
<h3>Total Spent</h3>
<p>₹4,200</p>
</div>

</div>


<div class="product-section">

<h2>Available Farm Products</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Product</th>
<th>Price</th>
<th>Action</th>
<th>Farmer</th>
<th>Location</th>
</tr>
</thead>


<tbody id="productTable"></tbody>
</table>

</div>

</section>

<script>

let email = localStorage.getItem("email");

if(!email){
    window.location.href = "../../login.html";
}

// LOAD PRODUCTS
function loadProducts() {

    fetch("http://localhost:8080/api/crops")
    .then(res => res.json())
    .then(data => {

        let table = document.getElementById("productTable");
        table.innerHTML = "";

        if(data.length === 0){
            table.innerHTML = "<tr><td colspan='4'>No products available</td></tr>";
            return;
        }

        data.forEach(crop => {
            table.innerHTML += `
            <tr>
                <td>${crop.id}</td>
                <td>${crop.cropName}</td>
                <td>₹${crop.price}</td>
                <td>
                
                
                   <button onclick="buyProduct(${crop.id}, ${crop.price})">
                   Buy
                </button>
                </td>
                <td>${crop.userEmail}</td>
                <td>${crop.location}</td>
            </tr>
            `;
        });

    })
    .catch(() => {
        alert("Error loading products ❌");
    });
}

function buyProduct(id, price){

    let quantity = prompt("Enter quantity:");

    if(!quantity) return;

    let total = quantity * price;

    // CREATE ORDER OBJECT
    const order = {

        cropId: id,
        quantity: quantity,
        consumerEmail: localStorage.getItem("email")

    };

    // SAVE TEMPORARILY
    localStorage.setItem(
        "pendingOrder",
        JSON.stringify(order)
    );

    // GO TO PAYMENT PAGE
    window.location.href =
    `payment.html?amount=${total}`;
}

function logout() {
    localStorage.clear();
    window.location.href = "../../login.html";
}

// INIT
loadProducts();

</script>

</body>
</html>
