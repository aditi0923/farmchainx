<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FarmchainX - Shipment Tracking</title>

<link rel="stylesheet" href="../../css/styles.css">

<style>
.timeline {
    margin: 30px;
    padding-left: 20px;
    border-left: 3px solid #4CAF50;
}

.step {
    margin-bottom: 20px;
}

.step span {
    font-weight: bold;
}

.active {
    color: green;
}
</style>

</head>

<body>

<h1>Shipment Tracking</h1>

<table>
<thead>
<tr>
    <th>Order ID</th>
    <th>Status</th>
    <th>Track</th>
</tr>
</thead>

<tbody id="trackingTable"></tbody>

</table>


<h2>Tracking Timeline</h2>

<div class="timeline">

    <div class="step" id="step1">
        🟡 <span>Pending</span>
    </div>

    <div class="step" id="step2">
        🔵 <span>Assigned</span>
    </div>

    <div class="step" id="step3">
        🟣 <span>In Transit</span>
    </div>

    <div class="step" id="step4">
        🟢 <span>Delivered</span>
    </div>

</div>


<script>

// GET ORDER ID FROM URL

const params = new URLSearchParams(window.location.search);

const id = params.get("id");


// LOAD TRACKING DATA

function loadTracking() {

    if (!id) {
        alert("Order ID not found ❌");
        return;
    }

    fetch("http://localhost:8080/api/orders")

    .then(res => res.json())

    .then(data => {

        let order = data.find(o => o.id == id);

        if (!order) {
            alert("Order not found ❌");
            return;
        }

        // SHOW ORDER

        let table = document.getElementById("trackingTable");

        table.innerHTML = `
            <tr>
                <td>${order.id}</td>

                <td>${order.status}</td>

                <td>
                    <button onclick="showOrder(${order.id})">
                        Trace
                    </button>
                </td>
            </tr>
        `;

        // UPDATE TIMELINE

        showTimeline(order.status);

    })

    .catch(error => {

        console.error(error);

        alert("Unable to load tracking data ❌");

    });
}


// SHOW TIMELINE

function showTimeline(status) {

    // Reset

    document.getElementById("step1").classList.remove("active");
    document.getElementById("step2").classList.remove("active");
    document.getElementById("step3").classList.remove("active");
    document.getElementById("step4").classList.remove("active");


    if (status === "Pending") {

        document.getElementById("step1")
        .classList.add("active");

    }


    else if (status === "Assigned") {

        document.getElementById("step1")
        .classList.add("active");

        document.getElementById("step2")
        .classList.add("active");

    }


    else if (status === "In Transit") {

        document.getElementById("step1")
        .classList.add("active");

        document.getElementById("step2")
        .classList.add("active");

        document.getElementById("step3")
        .classList.add("active");

    }


    else if (status === "Delivered") {

        document.getElementById("step1")
        .classList.add("active");

        document.getElementById("step2")
        .classList.add("active");

        document.getElementById("step3")
        .classList.add("active");

        document.getElementById("step4")
        .classList.add("active");

    }

}


// GO TO TRANSPORTER PAGE

function showOrder(id) {

    window.location.href =
        `transporter.html?id=${id}`;

}


// AUTO REFRESH

setInterval(() => {

    if (id) {
        loadTracking();
    }

}, 5000);


// INITIAL LOAD

loadTracking();

</script>

</body>
</html>
